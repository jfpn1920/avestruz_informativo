<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>avestruz informativo</title>
    <link rel="stylesheet" href="avestruz_informativo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="avestruz_informativo.js" defer></script>
</head>
<body>
    <!----------------------------------------->
    <!--|estructuracion_avestruz_informativo|-->
    <!----------------------------------------->
    <main class="app">
        <!-- FICHA: imagen, nombre y datos del avestruz -->
        <article class="ficha">
            <!-- Imagen: dibujo del avestruz hecho con formas SVG -->
            <figure class="imagen">
                <svg viewBox="0 0 200 220" role="img" aria-label="Dibujo de un avestruz">
                    <rect width="200" height="220" fill="#f7e7c6"/>
                    <rect y="200" width="200" height="20" fill="#d9b878"/>
                    <!-- Patas -->
                    <line x1="95" y1="150" x2="92" y2="205" stroke="#e8b9a0" stroke-width="5" stroke-linecap="round"/>
                    <line x1="110" y1="150" x2="118" y2="205" stroke="#e8b9a0" stroke-width="5" stroke-linecap="round"/>
                    <!-- Cola, cuerpo y ala -->
                    <ellipse cx="48" cy="118" rx="18" ry="28" fill="#f4f1ea"/>
                    <ellipse cx="100" cy="125" rx="50" ry="38" fill="#2b2b2b"/>
                    <ellipse cx="78" cy="120" rx="26" ry="22" fill="#f4f1ea"/>
                    <!-- Cuello, cabeza, pico y ojo -->
                    <line x1="125" y1="100" x2="142" y2="42" stroke="#e8b9a0" stroke-width="10" stroke-linecap="round"/>
                    <circle cx="144" cy="34" r="10" fill="#e8b9a0"/>
                    <polygon points="152,31 170,36 152,40" fill="#d98c5f"/>
                    <circle cx="147" cy="31" r="2" fill="#222"/>
                </svg>
            </figure>
            <!-- Nombre y botón de favorito -->
            <div class="titulo">
                <div>
                    <h1>Avestruz</h1>
                    <p class="cientifico">Struthio camelus</p>
                </div>
                <button id="btnFavorito" class="btn-favorito" type="button">☆ Favorito</button>
            </div>
            <!-- Datos clave: <dl> es una lista de términos y descripciones -->
            <dl class="datos">
                <div class="dato"><dt>Altura</dt><dd>Hasta 2,5 m</dd></div>
                <div class="dato"><dt>Peso</dt><dd>90 a 130 kg</dd></div>
                <div class="dato"><dt>Velocidad</dt><dd>Hasta 70 km/h</dd></div>
                <div class="dato"><dt>Vida</dt><dd>30 a 40 años</dd></div>
                <div class="dato"><dt>Hábitat</dt><dd>Sabanas de África</dd></div>
                <div class="dato"><dt>Dieta</dt><dd>Plantas, semillas e insectos</dd></div>
            </dl>
        </article>
        <!-- DATO CURIOSO: JavaScript cambia el texto con el botón -->
        <section class="panel">
            <h2>Dato curioso</h2>
            <p id="curiosidad" class="curiosidad"></p>
            <p id="progreso" class="progreso"></p>
            <button id="btnCuriosidad" class="boton" type="button">Otro dato curioso</button>
        </section>
        <!-- NOTAS PERSONALES: se guardan mientras se escribe -->
        <section class="panel">
            <h2>Mis notas</h2>
            <textarea id="nota" rows="3" placeholder="Escribe lo que aprendiste..."></textarea>
        </section>
    </main>
</body>
</html>
